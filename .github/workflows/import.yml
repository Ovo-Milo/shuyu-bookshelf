name: Import existing Shuyu source

on:
  push:
    branches:
      - main
    paths:
      - shuyu-source.zip
      - .github/workflows/import.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack source and remove temporary importer
        shell: bash
        run: |
          unzip -q -o shuyu-source.zip
          rm -f shuyu-source.zip .github/workflows/import.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Shuyu personal bookshelf source"
          git push
